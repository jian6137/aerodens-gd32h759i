; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = bootloader, os

[env]
platform = https://github.com/jian6137/platform-gd32h7.git
board = gd32h759i_eval
framework = gd32h7xx_spl
monitor_speed = 115200
extra_scripts = 
	pre:tools/pio_pre_assets.py
	post:tools/pio_post_partitions.py
build_flags = 
	-DPIO_GD32H7_PRINTF_USART0

[env:bootloader]
board_build.ldscript = ldscripts/gd32h759i_bootloader.ld
board_upload.offset_address = 0x08000000
lib_ignore = lvgl, GD32H759I_Touch
build_flags = 
	-DPIO_GD32H7_PRINTF_USART0
	-Iinclude
	-Iinclude/bootloader
build_src_filter = 
	+<bootloader/*>
	-<os/*>

[env:os]
board_build.ldscript = ldscripts/gd32h759i_os.ld
board_upload.offset_address = 0x08010000
lib_ignore = GD32H759I_Touch, GD32H759I_SDIO_FatFs
build_flags = 
	-g3
	-fno-omit-frame-pointer
	-DPIO_GD32H7_PRINTF_USART0
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-Iinclude/bootloader
	-Iinclude/os
	-Iinclude/os/configs
	-Iinclude/os/rtthread
	-Isrc/os
	-Isrc/os/model
	-Isrc/os/touch
	-Isrc/os/ui
	-Isrc/os/ui/icons
	-Isrc/os/ui/screens
	-Isrc/os/ui/components
	-Isrc/os/ui/port
	-Wl,--wrap=main
	-Wl,-u,_printf_float
	-Wl,-u,_scanf_float
build_src_filter = 
	+<os/*>
	+<os/model/*>
	+<os/rtthread/*>
	+<os/touch/*>
	+<os/ui/*>
	+<os/ui/icons/*>
	+<os/ui/screens/*>
	+<os/ui/components/*>
	+<os/ui/port/*>
	-<bootloader/*>
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_server_args = 
	-f interface/cmsis-dap.cfg
	-f target/gd32h7xx.cfg
	-c "target create $_TARGETNAME.rtos cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -rtos rtthread"
lib_deps = lvgl/lvgl@^8.3.11
