# OpenOCD target configuration for GigaDevice GD32H7xx (ARM Cortex-M7)
# Project-level OpenOCD script for AeroDENS (supports arbitrary binary sizes with chunking)

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME gd32h7x
}

if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x10000
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
   set _CPUTAPID 0x6ba02477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x24000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

adapter speed 2000

reset_config none
cortex_m reset_config sysresetreq

$_TARGETNAME configure -event examine-end {
    # Enable DBG_CTL0 sleep/deepsleep/standby debug support
    mmw 0xE00E1004 0x00000007 0
}

# GD32H7xx FMC Flash Programmer (FMC_BASE = 0x52002000)
proc gd32h7_fmc_wait_ready {} {
    set timeout 5000
    while { $timeout > 0 } {
        set stat [mrw 0x52002010]
        if { [expr {$stat & 0x1}] == 0 } {
            return
        }
        sleep 1
        set timeout [expr {$timeout - 1}]
    }
    error "GD32H7 FMC timeout waiting for BUSY=0"
}

proc gd32h7_flash_bin {bin_file {base_addr 0x08000000}} {
    init
    catch {reset halt}
    catch {halt}
    sleep 50

    set file_size [file size $bin_file]
    if { $file_size <= 0 } {
        error "Empty firmware binary: $bin_file"
    }

    echo [format "GD32H7 FMC: Unlocking Flash controller for %d bytes at 0x%08X..." $file_size $base_addr]
    gd32h7_fmc_wait_ready

    # Unlock FMC_CTL (0x5200200C) if locked (bit 0 = LK)
    set ctl [mrw 0x5200200C]
    if { [expr {$ctl & 0x1}] != 0 } {
        mww 0x52002004 0x45670123
        mww 0x52002004 0xCDEF89AB
    }

    # Clear status flags in FMC_STAT (0x52002010)
    mww 0x52002010 0x47870000

    # Erase 4 KB (0x1000) sectors covering [base_addr .. base_addr + file_size)
    set num_sectors [expr {($file_size + 0xFFF) / 0x1000}]
    echo [format "GD32H7 FMC: Erasing %d sector(s) (4 KB each)..." $num_sectors]
    for {set i 0} {$i < $num_sectors} {incr i} {
        set sec_addr [expr {$base_addr + ($i * 0x1000)}]
        gd32h7_fmc_wait_ready
        mww 0x5200200C 0x00000004
        mww 0x52002014 $sec_addr
        mww 0x5200200C 0x00000084
        gd32h7_fmc_wait_ready
        mww 0x5200200C 0x00000000
    }

    # Install 24-byte Cortex-M7 Thumb-2 flash copier into AXI SRAM @ 0x24000000
    mww 0x24000000 0xd0082a00
    mww 0x24000004 0xc110c810
    mww 0x24000008 0x8f4ff3bf
    mww 0x2400000c 0x07ed681d
    mww 0x24000010 0x3a01d4fc
    mww 0x24000014 0xbe00e7f4

    # Program in 256 KB (0x40000) chunks into AXI SRAM buffer @ 0x24001000
    set chunk_size 0x40000
    set ram_buf 0x24001000
    set offset 0
    while { $offset < $file_size } {
        set rem [expr {$file_size - $offset}]
        set cur_len [expr {$rem > $chunk_size ? $chunk_size : $rem}]
        set cur_aligned [expr {($cur_len + 3) & ~3}]
        set cur_words [expr {$cur_aligned / 4}]
        set cur_dest [expr {$base_addr + $offset}]

        echo [format "GD32H7 FMC: Programming chunk at offset 0x%06X (%d bytes) to 0x%08X..." $offset $cur_len $cur_dest]

        # Zero-pad last word
        mww [expr {$ram_buf + $cur_aligned - 4}] 0xFFFFFFFF
        load_image $bin_file [expr {$ram_buf - $offset}] bin $ram_buf $cur_len

        # Enable FMC_CTL_PG (bit 1) and run Cortex-M7 RAM copier
        gd32h7_fmc_wait_ready
        mww 0x5200200C 0x00000002

        reg r0 $ram_buf
        reg r1 $cur_dest
        reg r2 $cur_words
        reg r3 0x52002010
        reg sp 0x24080000
        reg pc 0x24000001
        resume
        wait_halt 10000

        gd32h7_fmc_wait_ready
        mww 0x5200200C 0x00000000

        set offset [expr {$offset + $cur_len}]
    }

    # Lock FMC_CTL
    mww 0x5200200C 0x00000001

    echo "GD32H7 FMC: Verifying Flash..."
    verify_image $bin_file $base_addr bin

    echo "GD32H7 FMC: Programming complete, resetting target..."
    reset run
    shutdown
}

